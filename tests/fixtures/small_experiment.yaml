  kappa_scan: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 6.0, 8.0]
  kappa_refinement_steps: [0.1, 0.02, 0.005]
  calibration_tolerance: 0.1
algorithms:
  gamma_init: 0.1
  K: 75
  delta: 0.0001
  cosamp_max_iter: 20
  cosamp_tol: 1.0e-06
tuning:
  reference_snr_db: 12
  reference_pilot_length: 20
  alpha_values:
  - 0.0
  - 4.0
  - 8.0
  - 12.0
  beta_values:
  - 0.05
  - 0.1
  - 0.15
  num_thresholds: 30
evaluation:
  pilot_length: 20
  gamma_distribution_samples: 6
  convergence_sample_offset: 0
figures:
  tuning_indices: [0]
  evaluation_indices: [0]
