# Independent random streams for each experimental purpose.
seeds:
  kappa_calibration: 1379
  kappa_validation: 8641
  activity_tuning: 2953
  activity_evaluation: 7069
  communication_tuning: 4283
  communication_evaluation: 9517
  spatial_randomization: 6031

run:
  output_dir: results/quick
  num_tuning_samples: 4
  num_evaluation_samples: 6
system:
  N: 200
  M: 4
  S: 5
  R: 40.0
  pilot_lengths:
  - 15
  - 20
  - 25
  snr_db:
  - 8
  - 12
  - 16
