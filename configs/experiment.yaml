# Independent random streams for each experimental purpose.
seeds:
  kappa_calibration: 1379
  kappa_validation: 8641
  activity_tuning: 2953
  activity_evaluation: 7069
  communication_tuning: 4283
  communication_evaluation: 9517
  spatial_randomization: 9097

run:
  output_dir: results/experiment
  num_tuning_samples: 100
  num_evaluation_samples: 1000
system:
  N: 400
  M: 4
  S: 10
  R: 40.0
  pilot_lengths:
  - 20
  - 25
  - 30
  - 35
  - 40
  - 45
  snr_db:
  - 4
  - 8
  - 12
  - 16
  - 20
  - 24
activity:
  kappa_source: calibration
  V: 2
  D: 15.0
  exact_sparsity: false
  batch_size: 256
  calibration_samples: 5000
  # Broad ascending scan followed by bracket refinement.
  kappa_scan: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0]
  kappa_refinement_steps: [0.1, 0.02, 0.005]
  calibration_tolerance: 0.1
# The paper sets rho=kappa and U=D; these are resolved from saved activity.
algorithms:
  gamma_init: 0.1
  K: 500
  delta: 0.0001
  cosamp_max_iter: 50
  cosamp_tol: 1.0e-06
tuning:
  reference_snr_db: 12
  reference_pilot_length: 25
  alpha_values: [2, 4, 6, 8, 10, 12, 14]
  beta_values: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35]
  num_thresholds: 80
evaluation:
  pilot_length: 30
  gamma_distribution_samples: 100
  convergence_sample_offset: 0
figures:
  tuning_indices: [77, 97, 84]
  evaluation_indices: [714, 495, 106, 618, 442, 101, 781]
